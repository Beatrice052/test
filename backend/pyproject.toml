[project]
name = "opensearch-chatbi-backend"
version = "0.1.0"
description = "Governed OpenSearch ChatBI V6.1 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "mcp>=1.9.4,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "tenacity>=9,<10",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.8,<8",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
  "types-pyyaml>=6,<7",
  "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
