name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
        working-directory: backend
      - run: python scripts/check_schema_snapshots.py
      - run: uv run --project backend python scripts/generate_frontend_types.py --check
      - run: uv run --project backend python -m app.cli semantic compile --input-dir semantic-input/mock --output-dir .cache/ci-semantic
      - run: uv run ruff check app tests migrations ../scripts
        working-directory: backend
      - run: uv run ruff format --check app tests migrations ../scripts
        working-directory: backend
      - run: uv run mypy app
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --reporter=line
        working-directory: frontend
