methods:
  - method_id: rank
    version: v1
    display_name: Rank / Top N
    minimum_rows: 2
    required_semantic_types: [categorical_dimension, numeric_measure]
    exploratory_label_required: true
    default_params:
      n: 5
  - method_id: contribution
    version: v1
    display_name: 变化贡献
    minimum_rows: 2
    required_semantic_types: [categorical_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: within_group_contribution
    version: v1
    display_name: 组内贡献度
    purpose: 计算每个分组内部各类别对完整度量总量的贡献占比
    technical_description: 对每个 partition 分别计算 category value / partition total；要求完整分布且分组总量非零。
    minimum_rows: 2
    required_semantic_types: [categorical_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
    supported_partition_roles: [dimension]
    requires_category: true
    interpretation_limitations: [不适用于被截断的 Top N 分布, 分组总量为零时不计算]
  - method_id: mad_robust_zscore
    version: v1
    display_name: MAD Robust Z-score
    minimum_rows: 14
    required_semantic_types: [time_dimension, numeric_measure]
    exploratory_label_required: true
    default_params:
      threshold: 3.5
  - method_id: mean_median
    version: v1
    display_name: Mean / Median
    minimum_rows: 1
    required_semantic_types: [numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: percentiles
    version: v1
    display_name: Percentiles
    minimum_rows: 1
    required_semantic_types: [numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: std_cv
    version: v1
    display_name: Standard deviation / CV
    minimum_rows: 7
    required_semantic_types: [time_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: moving_average
    version: v1
    display_name: Moving Average
    minimum_rows: 7
    required_semantic_types: [time_dimension, numeric_measure]
    exploratory_label_required: true
    default_params:
      window: 7
  - method_id: hhi
    version: v1
    display_name: HHI Concentration
    minimum_rows: 2
    required_semantic_types: [categorical_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: pareto
    version: v1
    display_name: Pareto Contribution
    minimum_rows: 2
    required_semantic_types: [categorical_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: peak_to_average
    version: v1
    display_name: Peak-to-average Ratio
    minimum_rows: 2
    required_semantic_types: [numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: trend_slope
    version: v1
    display_name: Trend Slope
    minimum_rows: 2
    required_semantic_types: [time_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
  - method_id: period_change
    version: v1
    display_name: Period Change
    minimum_rows: 2
    required_semantic_types: [time_dimension, numeric_measure]
    exploratory_label_required: true
    default_params: {}
